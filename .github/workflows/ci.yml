name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          switch -CaseSensitive ($env:EVENT) {
            'push' {
              'code=true' >> $env:GITHUB_OUTPUT
              exit 0
            }
            'pull_request' {
              $base = git rev-parse HEAD^1
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the pull request base.' }
            }
            'merge_group' {
              git fetch --no-tags --depth=1 origin $env:QUEUE_BASE
              if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the merge group base.' }
              $base = $env:QUEUE_BASE
            }
            default { throw 'Unsupported classification event.' }
          }

          # PowerShell 7.4+ preserves native stdout bytes when redirecting to a file.
          # No rename detection: a source-to-Markdown rename still deletes a source path.
          $diffPath = Join-Path $env:RUNNER_TEMP 'changed-paths'
          git diff --name-only --no-renames -z $base HEAD > $diffPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the changed paths.' }
          $paths = [System.IO.File]::ReadAllText($diffPath, [System.Text.UTF8Encoding]::new($false, $true))
          $code = 'false'
          if ($paths.Length -gt 0) {
            if ($paths[-1] -ne [char]0) { throw 'Changed paths are not NUL-terminated.' }
            foreach ($path in $paths.Substring(0, $paths.Length - 1).Split([char]0)) {
              if ($path.Length -eq 0) { throw 'Changed paths contain an empty entry.' }
              if (-not $path.EndsWith('.md', [System.StringComparison]::Ordinal) -and $path -cne 'LICENSE') {
                $code = 'true'
              }
            }
          }
          "code=$code" >> $env:GITHUB_OUTPUT

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The analyzer wall runs once for every target compilation. Every OS compiles the same
    # LF-normalized sources, and the only OS-conditioned setting that reaches a compilation is
    # the Windows-only net472 test target, which IncludeNet472Tests adds here.
    # MSBuild reads the variable as a property in every step, so restore, format and build see
    # the same targets.
    env:
      IncludeNet472Tests: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log resolved SDK
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          exit $LASTEXITCODE

      - name: Restore local tools
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool restore
          exit $LASTEXITCODE

      - name: Detect slop
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool run slopwatch analyze --exclude ".scratchpad/**" --fail-on warning
          exit $LASTEXITCODE

      - name: Build with analyzers
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build OpenCode.Agents.AI.slnx --configuration Release
          exit $LASTEXITCODE

      - name: Verify whitespace
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format whitespace OpenCode.Agents.AI.slnx --verify-no-changes --no-restore
          exit $LASTEXITCODE

      - name: Verify style
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format style OpenCode.Agents.AI.slnx --verify-no-changes --no-restore --severity warn
          exit $LASTEXITCODE

      - name: Validate package
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack src/OpenCode.Agents.AI/OpenCode.Agents.AI.csproj --no-build --no-restore --configuration Release -p:EnablePackageValidation=true --output "${{ runner.temp }}/package-validation"
          exit $LASTEXITCODE

  build-and-test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        include:
          - os: windows-2025
            name: windows
          - os: ubuntu-24.04
            name: linux
          - os: macos-15
            name: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log resolved SDK
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          exit $LASTEXITCODE

      - name: Build
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build OpenCode.Agents.AI.slnx --configuration Release -p:RunAnalyzers=false
          exit $LASTEXITCODE

      - name: Test
        id: test
        timeout-minutes: 35
        env:
          TUNIT_DISABLE_ARTIFACT_UPLOAD: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --solution OpenCode.Agents.AI.slnx --configuration Release --no-build --report-trx --results-directory artifacts/test-results --minimum-expected-tests 1 --timeout 25m --hangdump --hangdump-timeout 15m --hangdump-type Mini
          exit $LASTEXITCODE

      - name: Publish test results
        id: test-results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        # Allow fork PRs to fail gracefully (permission error) without breaking the workflow.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          name: "Test Results (${{ matrix.name }})"
          # The merged TRX repeats the per-framework results; count only the originals.
          path: "artifacts/test-results/*.trx"
          reporter: dotnet-trx
          path-replace-backslashes: true
          fail-on-error: true

      # Badge posting failure must not fail CI: the badgesmith.cs tool exits 0 on a failed post
      # unless --fail-on-error is passed (which this action never does), and continue-on-error
      # here is defense in depth against pre-flight validation failures. always() plus the
      # ref/event guard mirrors badge-smith's own ci-cd.yml so a failing master run still posts
      # the (failing) counts instead of leaving the badge stale.
      # GitHub Actions treats any remote reference under .github/workflows/ as a REUSABLE
      # WORKFLOW and refuses it inside steps ("reusable workflows should be referenced at the
      # top-level jobs.*.uses key"), so the composite action cannot be consumed remotely from its
      # current home. Until badge-smith relocates it (e.g. .github/actions/) and re-tags, we check
      # the pinned tag out and consume the action through the local-path form badge-smith itself
      # uses; the action is github.action_path-relative, so the relocated checkout is
      # self-contained.
      - name: Checkout BadgeSmith action
        if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: localstack-dotnet/badge-smith
          # Pinned to the commit the live api.localstackfor.net deployment runs, keeping the
          # signing tool and the server in lockstep. (The 2026-08-31 401s were ultimately a
          # corrupted repository secret, not the tag - but deploy-aligned pinning stays the
          # safer default until badge-smith tags releases in lockstep with its deployments.)
          ref: bc7ed07860ec4b0e702add6370c2636daccb2adf
          path: .badge-smith

      - name: Update test badge via BadgeSmith API
        if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: ./.badge-smith/.github/workflows/update-test-badge
        with:
          platform: ${{ matrix.name }}
          test_passed: '${{ steps.test-results.outputs.passed || 0 }}'
          test_failed: '${{ steps.test-results.outputs.failed || 0 }}'
          test_skipped: '${{ steps.test-results.outputs.skipped || 0 }}'
          test_url_html: ${{ steps.test-results.outputs.url_html || '' }}
          commit_sha: '${{ github.sha }}'
          run_id: '${{ github.run_id }}'
          repository: '${{ github.repository }}'
          server_url: '${{ github.server_url }}'
          api_base_url: 'https://api.localstackfor.net'
          hmac_secret: '${{ secrets.TESTDATASECRET }}'

      - name: List tests after failure
        if: ${{ failure() && !cancelled() && steps.build.outcome == 'success' && steps.test.outcome == 'failure' }}
        timeout-minutes: 5
        env:
          TUNIT_DISABLE_ARTIFACT_UPLOAD: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test --solution OpenCode.Agents.AI.slnx --configuration Release --no-build --list-tests
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/**
          retention-days: 7

  ci-result:
    name: CI result
    needs: [changes, lint, build-and-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "changes=$env:CHANGES code=$env:CODE lint=$env:LINT build-and-test=$env:BUILD_AND_TEST"
          $errors = [System.Collections.Generic.List[string]]::new()
          if ($env:CHANGES -cne 'success') { $errors.Add('Changes must succeed.') }
          switch -CaseSensitive ($env:CODE) {
            'true' {
              if ($env:LINT -cne 'success') { $errors.Add('Code changes require successful lint.') }
              if ($env:BUILD_AND_TEST -cne 'success') { $errors.Add('Code changes require successful build/test legs.') }
            }
            'false' {
              if ($env:LINT -cne 'skipped') { $errors.Add('Documentation-only changes require skipped lint.') }
              if ($env:BUILD_AND_TEST -cne 'skipped') { $errors.Add('Documentation-only changes require skipped build/test legs.') }
            }
            default { $errors.Add('Code classification must be true or false.') }
          }
          foreach ($message in $errors) { Write-Output "::error::$message" }
          if ($errors.Count -gt 0) { exit 1 }
