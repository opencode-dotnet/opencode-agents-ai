# The pinned Bun, in the one place every job installs it from: the clone detector's own
# packageManager row in tools/jscpd/package.json, which also holds its lockfile.
#
# Requires an already-checked-out repository.
name: "Setup pinned Bun"
description: "Installs the Bun that tools/jscpd/package.json's packageManager row names, and verifies it."

runs:
  using: "composite"
  steps:
    - name: Setup Bun (clone detector runtime)
      uses: oven-sh/setup-bun@v2
      with:
        # The clone detector's packageManager row.
        bun-version-file: tools/jscpd/package.json

    - name: Verify pinned Bun runtime
      shell: pwsh
      run: |
        $expected = (Get-Content tools/jscpd/package.json -Raw | ConvertFrom-Json).packageManager
        $actual = "bun@$(& bun --version)"
        if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
          throw "Bun runtime mismatch: expected $expected, got $actual."
        }
